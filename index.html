<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d1117">
<title>bye — Lyrics</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#0d1117;--text:#d4d4d4;--muted:#858585;--accent:#569cd6;--line:#252526}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:#0d1117;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
main{width:100%;margin:0;padding:0 0 50px}
.editor{overflow:hidden;border:0;border-radius:0;background:#0d1117;box-shadow:none}
.editor-bar{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #252526;background:#0d1117}
.dot{width:9px;height:9px;border-radius:50%}.red{background:#ff625c}.yellow{background:#ffbd44}.green{background:#35c96f}
.filename{margin-left:8px;color:#aaa3b5;font:12px ui-monospace,Consolas,monospace}
.editor-actions{margin-left:auto;display:flex;gap:8px}
button{border:1px solid #3c3c3c;background:#252526;color:#d4d4d4;border-radius:3px;padding:7px 12px;font:inherit;font-size:.72rem;cursor:pointer;transition:.2s}
button:hover{border-color:#569cd6;background:#333333}
.code-wrap{padding:22px 0 28px;overflow:auto;max-height:72vh}
.code{min-width:650px;margin:0;color:#d8d2df;font:clamp(12px,1.5vw,14px)/2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.line{display:grid;grid-template-columns:58px minmax(0,1fr);min-height:28px;padding:0 22px 0 0;white-space:pre}
.line::before{content:attr(data-no);color:#858585;text-align:right;padding-right:20px;user-select:none}
.line .src{display:block;min-height:28px}
.tag{color:#569cd6}.owner-tag{color:#00bfff}.attr{color:#9cdcfe}.value{color:#ce9178}.punct{color:#d4d4d4}.lyric{color:#d4d4d4}.string{color:#ce9178}.keyword{color:#c586c0}
.lyric-line{background:transparent;border-left:0}
.cursor{display:inline-block;width:2px;height:1.15em;background:#aeafad;vertical-align:-2px;margin-left:1px;animation:blink .85s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);opacity:0;background:#252526;color:#d4d4d4;padding:9px 15px;border:1px solid #3c3c3c;border-radius:3px;font-size:.8rem;pointer-events:none;transition:.2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.editor{border-radius:0}.code-wrap{padding:16px 0 22px}.line{grid-template-columns:42px minmax(0,1fr);padding-right:12px}.line::before{padding-right:12px}main{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main id="lyrics">
<section class="editor" aria-label="Animated lyric source">
<div class="editor-bar">
<span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
<span class="filename">bye.html</span>
<div class="editor-actions">
<button id="replay" type="button">Replay</button>
<button id="copy" type="button">Copy lyrics</button>
</div>
</div>
<div class="code-wrap"><div class="code" id="code"></div></div>
</section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite">Lyrics copied</div>
<script>
const before = [
'<span class="tag">&lt;!doctype html&gt;</span>',
'<span class="tag">&lt;html</span> <span class="attr">lang</span>=<span class="value">"en"</span><span class="tag">&gt;</span>',
'  <span class="tag">&lt;head&gt;</span>',
'    <span class="tag">&lt;meta</span> <span class="attr">charset</span>=<span class="value">"utf-8"</span><span class="tag">&gt;</span>',
'    <span class="tag">&lt;title&gt;</span><span class="lyric">bye</span><span class="tag">&lt;/title&gt;</span>',
'    <span class="tag">&lt;style&gt;</span>',
'      <span class="keyword">.lyrics</span> <span class="punct">{</span> <span class="attr">color</span><span class="punct">:</span> <span class="value">#f5f2f7</span><span class="punct">;</span> <span class="punct">}</span>',
'      <span class="keyword">.goodbye</span> <span class="punct">{</span> <span class="attr">opacity</span><span class="punct">:</span> <span class="value">1</span><span class="punct">;</span> <span class="punct">}</span>',
'    <span class="tag">&lt;/style&gt;</span>',
'  <span class="tag">&lt;/head&gt;</span>',
'  <span class="tag">&lt;body&gt;</span>',
'    <span class="tag">&lt;main</span> <span class="attr">class</span>=<span class="value">"lyrics"</span><span class="tag">&gt;</span>',
'      <span class="tag">&lt;div</span> <span class="attr">class</span>=<span class="value">"song"</span><span class="tag">&gt;</span>'
];

const lyrics = [
  [{t:'<bye>',c:'tag'},{t:' boy bye',c:'lyric'}],
  [{t:'<boy>',c:'tag'},{t:', bye, hmm',c:'lyric'}],
  [{t:'Hmm',c:'lyric'}],
  [{t:'<bye>',c:'tag'},{t:' bye',c:'lyric'}],
  [{t:'Boy, ',c:'lyric'},{t:'<bye>',c:'tag'}],
  [{t:"{ it's ",c:'punct'},{t:'<over>',c:'tag'},{t:" it's over oh yeah }",c:'lyric'}],
  [{t:"This ain't the first time I've been hostage to these tears",c:'lyric'}],
  [{t:"I can't believe I'm finally movin' through my fears",c:'lyric'}],
  [{t:"At least I know how hard we tried, both you and me",c:'lyric'}],
  [{t:"Didn't we? Didn't we?",c:'lyric'}],
  [{t:'So I grab my stuff',c:'lyric'}],
  [{t:'Courtney just pulled up in the driveway',c:'lyric'}],
  [{t:"It's time",c:'lyric'}],
  [{t:'<bye>',c:'tag'},{t:' bye',c:'lyric'}],
  [{t:'Boy, ',c:'lyric'},{t:'<bye>',c:'tag'}],
  [{t:'<bye>',c:'tag'},{t:' bye',c:'lyric'}],
  [{t:"{ it's ",c:'punct'},{t:'<over>',c:'tag'},{t:" it's over oh yeah }",c:'lyric'}],
  [{t:'<bye>',c:'tag'},{t:' bye',c:'lyric'}],
  [{t:"I'm takin' what's mine, yeah",c:'lyric'}],
  [{t:'<bye>',c:'tag'},{t:' bye',c:'lyric'}],
  [{t:"{ it's ",c:'punct'},{t:'<over>',c:'tag'},{t:" it's over oh yeah }",c:'lyric'}],
  [{t:"You know? I'm stronger than I think",c:'lyric'}],
  [{t:"Usually, I'd join you on the floor, but this dance ain't for me",c:'lyric'}],
  [{t:'Boy, just turn the music up',c:'lyric'}],
  [{t:"Maybe someday, we'll look back with love",c:'lyric'}],
  [{t:"Didn't think you'd lose me",c:'lyric'}],
  [{t:'Now ',c:'lyric'},{t:'<too-late>',c:'tag'},{t:' to choose me',c:'lyric'}],
  [{t:'So I grab my stuff',c:'lyric'}],
  [{t:'Courtney just pulled up in the driveway',c:'lyric'}],
  [{t:"It's time (It's time)",c:'lyric'}]
];

const after = [
'      <span class="tag">&lt;/div&gt;</span>',
'    <span class="tag">&lt;/main&gt;</span>',
'    <span class="tag">&lt;script&gt;</span>',
'      <span class="keyword">const</span> <span class="attr">goodbye</span> <span class="punct">=</span> <span class="string">"let go, let go"</span><span class="punct">;</span>',
'      <span class="keyword">const</span> <span class="attr">tears</span> <span class="punct">=</span> <span class="string">"a little less every day"</span><span class="punct">;</span>',
'      <span class="keyword">function</span> <span class="attr">moveOn</span><span class="punct">()</span> <span class="punct">{</span>',
'        <span class="keyword">return</span> <span class="value">true</span><span class="punct">;</span>',
'      <span class="punct">}</span>',
'      <span class="keyword">const</span> <span class="attr">nextChapter</span> <span class="punct">=</span> <span class="string">"still loading..."</span><span class="punct">;</span>',
'    <span class="tag">&lt;/script&gt;</span>',
'  <span class="tag">&lt;/body&gt;</span>',
'<span class="tag">&lt;/html&gt;</span>'
];

const code = document.getElementById('code');
const wrap = document.querySelector('.code-wrap');
const replayButton = document.getElementById('replay');
const toast = document.getElementById('toast');
const allLines = [
  ...before.map(code => ({code})),
  {code:'      <span class="owner-tag">&lt;by leovbriansyh&gt;</span>'},
  ...lyrics.map(lyric => ({lyric})),
  ...after.map(code => ({code}))
];
let runToken = 0;

function plainText(parts) {
  return parts.map(part => part.t).join('');
}

function delayFor(item) {
  if (!item.lyric) return 110;
  const length = Array.from(plainText(item.lyric)).length;
  return Math.min(850, 220 + length * 18);
}

async function play() {
  const token = ++runToken;
  code.innerHTML = '';
  wrap.scrollTop = 0;

  for (let i = 0; i < allLines.length; i++) {
    if (token !== runToken) return;
    const item = allLines[i];
    const row = document.createElement('div');
    row.className = 'line';
    if (item.lyric) row.classList.add('lyric-line');
    row.dataset.no = String(i + 1).padStart(2, '0');

    const src = document.createElement('span');
    src.className = 'src';
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    src.appendChild(cursor);
    row.appendChild(src);
    code.appendChild(row);
    row.scrollIntoView({block:'nearest',behavior:'smooth'});

    if (item.lyric) {
      for (const part of item.lyric) {
        const piece = document.createElement('span');
        piece.className = part.c;
        src.insertBefore(piece, cursor);
        for (const char of Array.from(part.t)) {
          if (token !== runToken) return;
          piece.textContent += char;
          await new Promise(resolve => setTimeout(resolve, char === ' ' ? 18 : 32));
        }
      }
    } else {
      src.innerHTML = item.code;
      src.appendChild(cursor);
    }

    await new Promise(resolve => setTimeout(resolve, delayFor(item)));
    if (token !== runToken) return;
    cursor.remove();
  }
}

replayButton.addEventListener('click', play);
play();

document.getElementById('copy').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText('bye — Lyrics\n\n' + lyrics.map(plainText).join('\n'));
    toast.textContent = 'Lyrics copied to clipboard';
  } catch {
    toast.textContent = 'Clipboard unavailable in this browser';
  }
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
});
</script>
</body>
</html>
